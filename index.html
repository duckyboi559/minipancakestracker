<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Pancake Tracker</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<h1>Mini Pancakes</h1>
<p class="subtitle">Tap Counter</p>

<div class="grid">

<div class="tile stack" onclick="changeCount('stack20',1)">
<h2>Stack’d 20</h2>
<p>$10</p>
<div class="count" id="stack20Count">0</div>
</div>

<div class="tile stack" onclick="changeCount('stack25',1)">
<h2>Stack’d 25</h2>
<p>$12</p>
<div class="count" id="stack25Count">0</div>
</div>

<div class="tile stack" onclick="changeCount('stack30',1)">
<h2>Stack’d 30</h2>
<p>$15</p>
<div class="count" id="stack30Count">0</div>
</div>

<div class="tile yourway" onclick="changeCount('your20',1)">
<h2>Your Way 20</h2>
<p>$8</p>
<div class="count" id="your20Count">0</div>
</div>

<div class="tile yourway" onclick="changeCount('your25',1)">
<h2>Your Way 25</h2>
<p>$10</p>
<div class="count" id="your25Count">0</div>
</div>

<div class="tile yourway" onclick="changeCount('your30',1)">
<h2>Your Way 30</h2>
<p>$12</p>
<div class="count" id="your30Count">0</div>
</div>

</div>

<div class="summary-card">
<h2>Grand Total</h2>
<div class="grand-total" id="grandTotal">$0.00</div>
</div>

<div class="summary-card">
<h2>Total Orders Sold</h2>
<div class="grand-total" id="totalItems">0</div>
</div>

<div class="summary-card">
<h2>Today's Date</h2>
<p id="todayDate"></p>
</div>

<div class="action-row">
<button class="save-btn" onclick="saveDay()">Save Day</button>
<button class="reset-btn" onclick="resetDay()">Reset Day</button>
</div>

<div class="summary-card">
<h2>Previous Days</h2>
<div id="historyList" class="history-list"></div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
