<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Pancake POS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>Mini Pancakes POS</h1>
      <p class="subtitle">Tap items, then choose Cash, Digital, or Split</p>
    </header>

    <section class="grid">
      <button class="tile pancake-tile" onclick="addItem('stack20', this)">
        <h2>20 Stack’d</h2>
        <p>$10</p>
        <div class="count" id="stack20Sold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>

      <button class="tile pancake-tile" onclick="addItem('stack25', this)">
        <h2>25 Stack’d</h2>
        <p>$12</p>
        <div class="count" id="stack25Sold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>

      <button class="tile pancake-tile" onclick="addItem('stack30', this)">
        <h2>30 Stack’d</h2>
        <p>$15</p>
        <div class="count" id="stack30Sold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>

      <button class="tile pancake-tile" onclick="addItem('your20', this)">
        <h2>20 Your Way</h2>
        <p>$8</p>
        <div class="count" id="your20Sold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>

      <button class="tile pancake-tile" onclick="addItem('your25', this)">
        <h2>25 Your Way</h2>
        <p>$10</p>
        <div class="count" id="your25Sold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>

      <button class="tile pancake-tile" onclick="addItem('your30', this)">
        <h2>30 Your Way</h2>
        <p>$12</p>
        <div class="count" id="your30Sold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>

      <button class="tile pancake-tile" onclick="addItem('bitestack', this)">
        <h2>Bite Stack 10</h2>
        <p>$5</p>
        <div class="count" id="bitestackSold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>

      <button class="tile dubai-tile" onclick="addItem('dubai', this)">
        <h2>Dubai Strawberries</h2>
        <p>$12</p>
        <div class="count" id="dubaiSold">0</div>
        <div class="sold-label">Today Sold</div>
      </button>
    </section>

    <section class="card current-order-card">
      <div class="card-header-row">
        <h2>Current Order</h2>
        <button class="small-btn dark-btn" onclick="undoLastTap()">Undo Last Tap</button>
      </div>

      <div id="orderList" class="order-list"></div>

      <div class="order-totals">
        <div class="order-total-line">
          <span>Items in Order</span>
          <strong id="orderItems">0</strong>
        </div>
        <div class="order-total-line big-line">
          <span>Subtotal</span>
          <strong id="orderSubtotal">$0.00</strong>
        </div>
      </div>

      <div class="checkout-row">
        <button class="pay-btn cash-btn" onclick="checkoutOrder('cash')">Pay Cash</button>
        <button class="pay-btn digital-btn" onclick="checkoutOrder('digital')">Pay Digital</button>
      </div>

      <div class="checkout-row">
        <button class="pay-btn split-btn" onclick="splitPaymentHalf()">Split 50/50</button>
        <button class="pay-btn split-custom-btn" onclick="splitPaymentCustom()">Split Custom</button>
      </div>

      <div class="checkout-row">
        <button class="pay-btn cancel-btn" onclick="clearCurrentOrder()">Clear Order</button>
      </div>
    </section>

    <section class="summary-grid">
      <div class="card summary-card">
        <h2>Today Sales</h2>
        <div class="big-number" id="todaySales">$0.00</div>
      </div>

      <div class="card summary-card">
        <h2>Cash</h2>
        <div class="big-number" id="cashTotal">$0.00</div>
      </div>

      <div class="card summary-card">
        <h2>Digital</h2>
        <div class="big-number" id="digitalTotal">$0.00</div>
      </div>

      <div class="card summary-card">
        <h2>Today Items</h2>
        <div class="big-number" id="todayItems">0</div>
      </div>
    </section>

    <section class="summary-grid">
      <div class="card summary-card">
        <h2>This Week</h2>
        <div class="big-number" id="weeklySales">$0.00</div>
      </div>

      <div class="card summary-card">
        <h2>Weekly Top Seller</h2>
        <div class="top-seller" id="weeklyTopSeller">None yet</div>
      </div>
    </section>

    <section class="card">
      <h2>Today's Date</h2>
      <p id="todayDate"></p>
      <div class="save-row">
        <button class="save-btn" onclick="saveDay()">Save Day</button>
        <button class="reset-btn" onclick="resetDay()">Reset Day</button>
      </div>
    </section>

    <section class="card">
      <h2>Previous Days</h2>
      <div id="historyList" class="history-list"></div>
    </section>
  </div>

  <div id="confettiContainer" class="confetti-container"></div>

  <script src="script.js"></script>
</body>
</html>
